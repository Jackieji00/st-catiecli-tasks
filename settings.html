<div id="catiecli_tasks_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Catiecli Tasks</b>
            <label class="checkbox_label" title="一键切换是否接管生成请求">
                <input id="catiecli_tasks_enabled" type="checkbox">
                <span>接管</span>
            </label>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container flexFlowColumn">
                <span class="flex-basis100 catiecli-key-label"><i class="fa-solid fa-key"></i> <b>cat- API 密钥</b>(独立于 ST 连接设置,填后保存):</span>
                <div class="flex-container">
                    <input id="catiecli_tasks_key" type="password" class="text_pole flex1 catiecli-key-input" placeholder="cat-xxxxxxxx" autocomplete="off">
                    <i id="catiecli_tasks_key_toggle" class="menu_button fa-solid fa-eye" title="显示/隐藏密钥"></i>
                    <i id="catiecli_tasks_key_save" class="menu_button fa-solid fa-save" title="保存密钥"></i>
                </div>
                <details class="flex-basis100">
                    <summary style="cursor:pointer;opacity:.7">自定义上游地址(可选,默认跟随 Custom Endpoint)</summary>
                    <div class="flex-container" style="margin-top:8px">
                        <input id="catiecli_tasks_upstream" type="text" class="text_pole flex1" placeholder="https://catiecli.sukaka.top">
                        <i id="catiecli_tasks_save" class="menu_button fa-solid fa-save" title="保存上游地址"></i>
                    </div>
                </details>
                <span class="flex-basis100">
                    生成请求改为「提交任务 + 轮询分片」,断网/切后台不报废回复。
                    仅接管 Custom 源且 API 地址含 catiecli 的连接(或已设自定义上游);
                    换用其他 API 无需关开关,自动直连。
                </span>
            </div>
        </div>
    </div>
</div>
